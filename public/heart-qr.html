<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Heart QR — Mohit's Birthday</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      * { box-sizing: border-box; margin: 0; }
      body {
        min-height: 100vh;
        font-family: 'Inter', sans-serif;
        background: linear-gradient(180deg, #12032b, #061c3f);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        max-width: 420px;
        width: 100%;
        text-align: center;
        background: rgba(255,255,255,0.08);
        border: 1px solid rgba(255,255,255,0.15);
        border-radius: 32px;
        padding: 32px 24px;
        backdrop-filter: blur(20px);
        box-shadow: 0 20px 60px rgba(0,0,0,0.4);
      }
      h1 {
        font-family: 'Playfair Display', serif;
        font-size: 1.5rem;
        margin-bottom: 8px;
      }
      p { color: rgba(255,255,255,0.65); font-size: 0.9rem; line-height: 1.5; }
      .qr-wrap {
        margin: 24px auto;
        width: 280px;
        height: 280px;
        background: #fff;
        border-radius: 20px;
        padding: 8px;
        box-shadow: 0 8px 32px rgba(255,45,149,0.25);
      }
      .qr-wrap img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .btn {
        display: block;
        width: 100%;
        margin-top: 12px;
        padding: 14px 20px;
        border: none;
        border-radius: 999px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        color: #fff;
        text-decoration: none;
        background: linear-gradient(135deg, #ff2d95, #e91e8c);
        box-shadow: 0 4px 24px rgba(255,45,149,0.5);
      }
      .btn-secondary {
        background: rgba(255,255,255,0.08);
        border: 1px solid rgba(255,255,255,0.2);
        box-shadow: none;
        color: rgba(255,255,255,0.85);
      }
      .tip {
        margin-top: 16px;
        font-size: 0.75rem;
        color: rgba(255,255,255,0.45);
        line-height: 1.4;
      }
      .url {
        margin-top: 12px;
        font-size: 0.7rem;
        color: rgba(255,255,255,0.35);
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Scan the Heart ❤️</h1>
      <p>
        Print this or show it on your phone. When Mohit scans it, his birthday
        surprise opens instantly!
      </p>

      <div class="qr-wrap">
        <img src="/heart-qr.png" alt="Heart-shaped QR code for Mohit's birthday" />
      </div>

      <a class="btn" href="/heart-qr.png" download="mohit-birthday-heart-qr.png">
        Download Heart QR (PNG)
      </a>
      <a class="btn btn-secondary" href="https://happy-birthday-xi-green.vercel.app/" target="_blank" rel="noopener">
        Open Birthday Site
      </a>

      <p class="tip">
        Tip: Print at least 3×3 inches for easy scanning. Test with your phone camera before gifting!
      </p>
      <p class="url">https://happy-birthday-xi-green.vercel.app/</p>
    </div>
  </body>
</html>
